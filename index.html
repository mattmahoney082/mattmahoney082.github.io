<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matthew's Apps</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F5F0DC;color:#0A0A0A;font:16px/1.5 system-ui,sans-serif}

main{display:flex;gap:24px;flex-wrap:wrap;justify-content:center;padding:16px}
a{display:block;width:200px;padding:28px 16px;text-align:center;border:1px solid #C8C2B0;border-radius:16px;color:inherit;text-decoration:none;font:500 28px/1.2 Georgia,serif}
a:hover{border-color:#3B3BFF}
a img{display:block;width:104px;height:104px;margin:0 auto 14px;border-radius:24px}
</style>
</head>
<body><main><a href="horarium/"><img src="horarium/icon-192.png" alt=""><span>Horarium</span></a><a href="tabularium/"><img src="tabularium/icon-192.png" alt=""><span>Tabularium</span></a></main></body>
</html>
